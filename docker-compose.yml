version: '3.8'

# docker-compose.yml — 检验业务现场作业系统
#
# 服务：
#   - lab-field-ops: 主应用（HTTP server：REST API + 静态 SPA）
#
# 数据持久化：
#   - ./data → /app/data（SQLite + JSONL 写回通道 + 描述子热重载文件）
#   - ./logs → /app/logs（队列 / audit / 业务日志）
#
# 启动：
#   docker compose up -d
#   docker compose logs -f lab-field-ops
#   浏览器访问 http://localhost:4000

services:
  lab-field-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-field-ops:latest
    container_name: lab-field-ops
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_PATH: data/lab.db
      LIS_WRITEBACK_CHANNEL: data/lis-writeback.ndjson
      EMBED_ALLOWLIST_CIDR: ""
      AUTH_TOKEN: "replace-with-long-random-string"
      HEARTBEAT_RATE_LIMIT: "10"
      EMBED_REGISTRY_PATH: data/embed-registry.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/instruments"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s